<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <!-- 1. Vertical Body Gradient: Mint -> Teal -> Slate -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0AEEC3" />
      <stop offset="25%" stop-color="#1AD3C1" />
      <stop offset="50%" stop-color="#26BFBE" />
      <stop offset="75%" stop-color="#3A9DBF" />
      <stop offset="100%" stop-color="#4E7FBD" />
    </linearGradient>

    <!-- 2. Right Facet Gradient (150deg / ~30deg from vertical) -->
    <linearGradient id="facetRightGrad" x1="0%" y1="0%" x2="50%" y2="86.6%">
      <stop offset="0%" stop-color="#4193BD" />
      <stop offset="100%" stop-color="#5A6CBC" />
    </linearGradient>

    <!-- 3. Left Facet Gradient (210deg mirror) -->
    <linearGradient id="facetLeftGrad" x1="100%" y1="0%" x2="50%" y2="86.6%">
      <stop offset="0%" stop-color="#4193BD" />
      <stop offset="100%" stop-color="#5A6CBC" />
    </linearGradient>

    <!-- 4. Accent Circle Fill: 45deg Violet -> Aqua -->
    <linearGradient id="circleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5D54F2" />
      <stop offset="100%" stop-color="#14BCA3" />
    </linearGradient>

    <!-- 5. Accent Ring: 225deg Reversed -->
    <linearGradient id="ringGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5361E8" />
      <stop offset="100%" stop-color="#15BAA5" />
    </linearGradient>

    <!-- Text Clip Path -->
    <clipPath id="textClip">
      <text x="30" y="125" font-family="'Outfit', 'Cairo', sans-serif" font-weight="800" font-size="82" letter-spacing="-2px">
        FACETED SUMMIT
      </text>
    </clipPath>
  </defs>

  <g id="faceted-wordmark" clip-path="url(#textClip)">
    <!-- Base Body Gradient -->
    <rect x="0" y="0" width="920" height="180" fill="url(#bodyGrad)" />

    <!-- Right-Lower Angled Facet Slices with Hairline Gap -->
    <path d="M 0,110 L 920,165 L 920,180 L 0,180 Z" fill="url(#facetRightGrad)" />
    <line x1="0" y1="109" x2="920" y2="164" stroke="#0B1626" stroke-width="1.8" />

    <!-- Left-Lower Angled Facet Slices with Hairline Gap -->
    <path d="M 0,165 L 920,110 L 920,180 L 0,180 Z" fill="url(#facetLeftGrad)" opacity="0.65" />
    <line x1="0" y1="164" x2="920" y2="109" stroke="#0B1626" stroke-width="1.8" />
  </g>

  <!-- Accent Circle Dot with Reversed Gradient Ring -->
  <g id="accent-dot" transform="translate(790, 110)">
    <circle cx="16" cy="0" r="14" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" />
    <circle cx="16" cy="0" r="12" fill="url(#circleGrad)" />
  </g>
</svg>
